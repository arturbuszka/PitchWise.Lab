name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build PitchWise.slnx -c Release

      # Tests that need the SoccerNet frames and ONNX models report as skipped here.
      - name: Test
        run: dotnet test PitchWise.slnx -c Release --no-build
